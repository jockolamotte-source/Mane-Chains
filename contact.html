<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Mane Chain</title>
<meta name="description" content="Mane Chain hair jewelry">
<link rel="stylesheet" href="assets/css/styles.css">
</head><body>
<main>
<section class="page-hero"><div class="container"><div class="eyebrow">Contact Us</div><h1>We’re here to help.</h1><p>If you have any questions regarding our products, please don't hesitate to reach out. We are here to assist you.</p></div></section>
<section class="section"><div class="container contact-grid">
  <div><div class="script">Say hello</div><h2 style="font-family:'Montserrat',sans-serif;font-weight:500;font-size:3.8rem;line-height:1;letter-spacing:-.05em;margin:8px 0">Questions, styling help, or custom ideas?</h2><p>The form is ready to connect to a static-site form service before launch.</p></div>
  <div class="contact-card">
    <form onsubmit="event.preventDefault();alert('Contact form integration will be connected before launch.');">
      <div class="field"><label>Name</label><input required></div>
      <div class="field"><label>Email</label><input type="email" required></div>
      <div class="field"><label>Message</label><textarea rows="6" required></textarea></div>
      <button class="btn" type="submit">Send Message</button>
    </form>
  </div>
</div></section>
</main>

<script src="assets/js/products.js"></script>
<script src="assets/js/site.js"></script>

</body></html>
