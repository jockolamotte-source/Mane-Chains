name: Sync Mane Chain Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Google Calendar
        run: python scripts/sync_calendar.py

      - name: Commit calendar changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/events.json
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Sync Google Calendar events"
            git push
          fi
